# Per-app overrides on top of /etc/keyd/default.conf.
# Browsers' own UI (omnibox etc.) ignores the XF86Copy/Paste/Cut keysyms,
# so emit real Ctrl combos when a browser window has focus.

[brave-browser]

meta.c = C-c
meta.v = C-v
meta.x = C-x

[chromium]

meta.c = C-c
meta.v = C-v
meta.x = C-x

[google-chrome]

meta.c = C-c
meta.v = C-v
meta.x = C-x
